<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Nhật Ký Công Việc</title>
  <style>
    :root {
      --primary-color: #007bff;
      --danger-color: #dc3545;
      --success-color: #28a745;
      --warning-color: #ffc107;
      --bg-color: #f4f6f9;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2, h3 { color: #333; margin-top: 0; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
    button.btn-danger { background-color: var(--danger-color); }
    button.btn-warning { background-color: var(--warning-color); color: #333; }
    button.btn-secondary { background-color: #6c757d; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table, th, td { border: 1px solid #ddd; }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th { background-color: #e9ecef; }
    
    /* Modal / Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
    }
    .actions { display: flex; gap: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2>📋 Nhật Ký Công Việc</h2>
    <div>
      <button onclick="openChangePinModal()" class="btn-warning">🔑 Đổi mã PIN</button>
      <button onclick="openAdminModal()" class="btn-secondary">⚙️ Admin</button>
    </div>
  </div>

  <!-- BỘ LỌC CHỌN NHÂN VIÊN -->
  <div class="form-group">
    <label for="selectUser">Chọn Nhân Viên Xem Nhật Ký:</label>
    <select id="selectUser" onchange="loadUserLogs()">
      <option value="">-- Đang tải danh sách... --</option>
    </select>
  </div>

  <!-- NÚT THÊM MỚI -->
  <div style="margin-bottom: 15px;">
    <button onclick="openLogModal('add')">➕ Thêm Nhật Ký Mới</button>
  </div>

  <!-- BẢNG DỮ LIỆU -->
  <h3>Danh sách công việc</h3>
  <table>
    <thead>
      <tr>
        <th>Ngày</th>
        <th>Công việc</th>
        <th>Chi tiết</th>
        <th>Ghi chú</th>
        <th>Cập nhật cuối</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody id="logsTableBody">
      <tr><td colspan="6" style="text-align:center;">Vui lòng chọn nhân viên để xem data.</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL THÊM / SỬA NHẬT KÝ -->
<div id="logModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Thêm Nhật Ký</h3>
    <input type="hidden" id="logId">
    
    <div class="form-group">
      <label>Ngày thực hiện:</label>
      <input type="date" id="logDate">
    </div>
    <div class="form-group">
      <label>Tên công việc:</label>
      <input type="text" id="logTask">
    </div>
    <div class="form-group">
      <label>Nội dung chi tiết:</label>
      <textarea id="logDetails" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Ghi chú:</label>
      <input type="text" id="logNote">
    </div>

    <!-- Trường nhập PIN (chỉ hiển thị khi SỬA) -->
    <div class="form-group" id="pinGroup" style="display: none;">
      <label style="color: var(--danger-color);">Mã PIN xác nhận (4 số):</label>
      <input type="password" id="userPin" maxlength="4" placeholder="****">
    </div>

    <div style="text-align: right; margin-top: 15px;">
      <button onclick="closeModal('logModal')" class="btn-secondary">Hủy</button>
      <button onclick="saveLog()">Lưu lại</button>
    </div>
  </div>
</div>

<!-- MODAL ĐỔI MÃ PIN -->
<div id="changePinModal" class="modal">
  <div class="modal-content">
    <h3>🔑 Đổi Mã PIN Cá Nhân</h3>
    <div class="form-group">
      <label>Nhân viên:</label>
      <select id="pinUserSelect"></select>
    </div>
    <div class="form-group">
      <label>Mã PIN hiện tại:</label>
      <input type="password" id="oldPin" maxlength="4" placeholder="****">
    </div>
    <div class="form-group">
      <label>Mã PIN mới (4 số):</label>
      <input type="password" id="newPin" maxlength="4" placeholder="****">
    </div>
    <div style="text-align: right; margin-top: 15px;">
      <button onclick="closeModal('changePinModal')" class="btn-secondary">Hủy</button>
      <button onclick="submitChangePin()">Xác nhận đổi</button>
    </div>
  </div>
</div>

<!-- MODAL ADMIN (TẠO USER MỚI) -->
<div id="adminModal" class="modal">
  <div class="modal-content">
    <h3>⚙️ Quản Trị Viên (Admin)</h3>
    <div id="adminLoginForm">
      <div class="form-group">
        <label>Username Admin:</label>
        <input type="text" id="adminUser">
      </div>
      <div class="form-group">
        <label>Password Admin:</label>
        <input type="password" id="adminPass">
      </div>
      <button onclick="adminLogin()">Đăng Nhập Admin</button>
    </div>

    <div id="adminActionForm" style="display: none;">
      <h4>Tạo Nhân Viên Mới</h4>
      <div class="form-group">
        <label>Họ và Tên:</label>
        <input type="text" id="newFullName">
      </div>
      <div class="form-group">
        <label>Phòng ban:</label>
        <input type="text" id="newDepartment">
      </div>
      <div class="form-group">
        <label>Mã PIN mặc định (4 số):</label>
        <input type="text" id="newPinAdmin" value="1234" maxlength="4">
      </div>
      <button onclick="createUser()">Tạo Nhân Viên</button>
    </div>

    <div style="text-align: right; margin-top: 15px;">
      <button onclick="closeModal('adminModal')" class="btn-secondary">Đóng</button>
    </div>
  </div>
</div>

<script>
  // 🔴 THAY BẰNG URL GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
  const API_URL = "https://script.google.com/macros/s/AKfycbxUAnRvDav8t9bjXSuCIxnjGvy4RJULDfxltdBA8KmFlQbuTUzX6xFY7cT4Me-uh8pu/exec";

  let usersList = [];
  let currentLogs = [];

  // Tự động tải danh sách User khi mở trang
  window.onload = function() {
    // Đặt ngày mặc định là hôm nay
    document.getElementById('logDate').valueAsDate = new Date();
    loadUsers();
  };

  function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }

  // 1. TẢI DANH SÁCH NHÂN VIÊN
  function loadUsers() {
    fetch(`${API_URL}?action=getUsers`)
      .then(res => res.json())
      .then(data => {
        usersList = data;
        const selectUser = document.getElementById('selectUser');
        const pinUserSelect = document.getElementById('pinUserSelect');
        
        selectUser.innerHTML = '<option value="">-- Chọn nhân viên --</option>';
        pinUserSelect.innerHTML = '';

        data.forEach(u => {
          selectUser.innerHTML += `<option value="${u.fullName}">${u.fullName} (${u.department})</option>`;
          pinUserSelect.innerHTML += `<option value="${u.fullName}">${u.fullName}</option>`;
        });

        if (data.length > 0) {
          selectUser.selectedIndex = 1;
          loadUserLogs();
        }
      });
  }

  // 2. TẢI NHẬT KÝ CỦA USER ĐƯỢC CHỌN
  function loadUserLogs() {
    const userName = document.getElementById('selectUser').value;
    const tbody = document.getElementById('logsTableBody');
    if (!userName) return;

    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Đang tải dữ liệu...</td></tr>';

    fetch(`${API_URL}?action=getLogs&userName=${encodeURIComponent(userName)}`)
      .then(res => res.json())
      .then(logs => {
        currentLogs = logs;
        if (logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Chưa có nhật ký nào.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        logs.forEach(log => {
          tbody.innerHTML += `
            <tr>
              <td>${log.date}</td>
              <td><b>${log.task}</b></td>
              <td>${log.details}</td>
              <td>${log.note || ''}</td>
              <td><small>${log.lastUpdated || ''}</small></td>
              <td class="actions">
                <button class="btn-warning" onclick="openLogModal('edit', '${log.logId}')">Sửa</button>
                <button class="btn-danger" onclick="deleteLog('${log.logId}')">Xóa</button>
              </td>
            </tr>
          `;
        });
      });
  }

  // 3. MỞ POPUP THÊM / SỬA NHẬT KÝ
  function openLogModal(mode, logId = '') {
    const userName = document.getElementById('selectUser').value;
    if (!userName) {
      alert("Vui lòng chọn nhân viên trước!");
      return;
    }

    document.getElementById('logModal').style.display = 'flex';
    document.getElementById('pinGroup').style.display = mode === 'edit' ? 'block' : 'none';
    document.getElementById('userPin').value = '';

    if (mode === 'add') {
      document.getElementById('modalTitle').innerText = 'Thêm Nhật Ký Mới';
      document.getElementById('logId').value = '';
      document.getElementById('logTask').value = '';
      document.getElementById('logDetails').value = '';
      document.getElementById('logNote').value = '';
    } else {
      document.getElementById('modalTitle').innerText = 'Chỉnh Sửa Nhật Ký';
      const log = currentLogs.find(l => l.logId === logId);
      if (log) {
        document.getElementById('logId').value = log.logId;
        document.getElementById('logDate').value = log.date;
        document.getElementById('logTask').value = log.task;
        document.getElementById('logDetails').value = log.details;
        document.getElementById('logNote').value = log.note;
      }
    }
  }

  // 4. LƯU DỮ LIỆU THÊM / SỬA (GỬI ĐẾN GOOGLE APPS SCRIPT)
  function saveLog() {
    const fullName = document.getElementById('selectUser').value;
    const logId = document.getElementById('logId').value;
    const date = document.getElementById('logDate').value;
    const task = document.getElementById('logTask').value;
    const details = document.getElementById('logDetails').value;
    const note = document.getElementById('logNote').value;
    const pin = document.getElementById('userPin').value;

    const action = logId ? 'updateLog' : 'addLog';

    if (action === 'updateLog' && (!pin || pin.length !== 4)) {
      alert("Vui lòng nhập mã PIN 4 số để xác nhận sửa!");
      return;
    }

    const payload = {
      action: action,
      fullName: fullName,
      logId: logId,
      date: date,
      task: task,
      details: details,
      note: note,
      pin: pin,
      deviceInfo: navigator.userAgent
    };

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        alert("Lưu thành công!");
        closeModal('logModal');
        loadUserLogs();
      } else {
        alert("Lỗi: " + res.message);
      }
    });
  }

  // 5. XÓA NHẬT KÝ (YÊU CẦU MÃ PIN)
  function deleteLog(logId) {
    const fullName = document.getElementById('selectUser').value;
    const pin = prompt("Nhập mã PIN 4 số của bạn để XÓA công việc này:");

    if (pin === null) return; // Người dùng bấm Hủy

    if (pin.trim().length !== 4) {
      alert("Mã PIN phải gồm 4 số!");
      return;
    }

    const payload = {
      action: 'deleteLog',
      fullName: fullName,
      logId: logId,
      pin: pin
    };

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        alert("Xóa thành công!");
        loadUserLogs();
      } else {
        alert("Lỗi: " + res.message);
      }
    });
  }

  // 6. ĐỔI MÃ PIN CÁ NHÂN
  function openChangePinModal() {
    document.getElementById('changePinModal').style.display = 'flex';
  }

  function submitChangePin() {
    const fullName = document.getElementById('pinUserSelect').value;
    const oldPin = document.getElementById('oldPin').value;
    const newPin = document.getElementById('newPin').value;

    if (!oldPin || !newPin || newPin.length !== 4) {
      alert("Mã PIN mới phải đúng 4 chữ số!");
      return;
    }

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'changePin',
        fullName: fullName,
        oldPin: oldPin,
        newPin: newPin
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        alert("Đổi mã PIN thành công!");
        closeModal('changePinModal');
      } else {
        alert("Lỗi: " + res.message);
      }
    });
  }

  // 7. CHỨC NĂNG QUẢN TRỊ (ADMIN)
  function openAdminModal() {
    document.getElementById('adminModal').style.display = 'flex';
    document.getElementById('adminLoginForm').style.display = 'block';
    document.getElementById('adminActionForm').style.display = 'none';
  }

  function adminLogin() {
    const user = document.getElementById('adminUser').value;
    const pass = document.getElementById('adminPass').value;

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'adminLogin', username: user, password: pass })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        document.getElementById('adminLoginForm').style.display = 'none';
        document.getElementById('adminActionForm').style.display = 'block';
      } else {
        alert("Đăng nhập Admin thất bại!");
      }
    });
  }

  function createUser() {
    const name = document.getElementById('newFullName').value;
    const dept = document.getElementById('newDepartment').value;
    const pin = document.getElementById('newPinAdmin').value;

    if (!name || !dept) {
      alert("Vui lòng điền đủ Họ tên và Phòng ban!");
      return;
    }

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'createUser', fullName: name, department: dept, pin: pin })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        alert("Tạo nhân viên thành công!");
        loadUsers();
        closeModal('adminModal');
      } else {
        alert("Lỗi: " + res.message);
      }
    });
  }
</script>
</body>
</html>
