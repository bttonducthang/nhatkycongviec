<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật Ký Công Việc Hàng Ngày</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">

  <!-- URL API kết nối với Google Apps Script -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzVeC6SF6TBlXM_J0qmgtKydKblTAxPQ0SVvdLgI1Z-tMUGGnwILHBH-bwU12WmTfE/exec";
    let currentUserList = [];
  </script>

  <!-- NAVIGATION BAR -->
  <nav class="bg-indigo-700 text-white p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-bold">Quản Lý Nhật Ký Công Việc</h1>
    <button onclick="toggleAdminModal()" class="bg-indigo-900 hover:bg-indigo-800 px-3 py-1 rounded text-sm transition">
      Quản Trị Viên
    </button>
  </nav>

  <div class="max-w-4xl mx-auto p-4 md:p-6">

    <!-- TRANG 1: FORM CẬP NHẬT CÔNG VIỆC -->
    <div id="pageForm" class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2">Nhập Nhật Ký Công Việc</h2>
      
      <form id="jobForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Họ tên -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên *</label>
            <select id="userSelect" onchange="onUserChange()" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
              <option value="">-- Chọn nhân viên --</option>
            </select>
          </div>
          
          <!-- Phòng ban (Tự động hiển thị) -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phòng ban</label>
            <input type="text" id="department" readonly class="w-full bg-gray-100 border rounded-lg p-2.5 text-gray-600 cursor-not-allowed">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Công việc thực hiện -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Công việc thực hiện ngắn gọn *</label>
            <input type="text" id="task" required placeholder="Nhập tiêu đề công việc" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
          </div>

          <!-- Ngày thực hiện -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày thực hiện</label>
            <input type="date" id="workDate" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <!-- Nội dung chi tiết -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nội dung công việc đã thực hiện *</label>
          <textarea id="details" rows="3" required placeholder="Ghi chi tiết tiến độ, kết quả công việc..." class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <!-- Ghi chú -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú (Không bắt buộc)</label>
          <input type="text" id="note" placeholder="Thông tin bổ sung..." class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition">
          Cập Nhật Công Việc
        </button>
      </form>
    </div>

    <!-- TRANG 2: DANH SÁCH CÔNG VIỆC ĐÃ LÀM -->
    <div id="pageList" class="hidden bg-white p-6 rounded-xl shadow-md space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-3">
        <div>
          <h2 class="text-lg font-bold text-gray-800">Danh Sách Công Việc Đã Thực Hiện</h2>
          <p id="listUserTitle" class="text-sm text-indigo-600 font-medium"></p>
        </div>
        <div class="flex gap-2">
          <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm transition">
            Tải Sheet về (.CSV)
          </button>
          <button onclick="showPage('form')" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-sm transition">
            Quay Về Form
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[600px]">
          <thead>
            <tr class="bg-slate-100 text-gray-700 text-sm">
              <th class="p-3 border">Ngày</th>
              <th class="p-3 border">Công việc</th>
              <th class="p-3 border">Nội dung chi tiết</th>
              <th class="p-3 border">Ghi chú</th>
              <th class="p-3 border text-center">Thao tác</th>
            </tr>
          </thead>
          <tbody id="logsTableBody" class="text-sm divide-y">
            <!-- Dữ liệu được load động vào đây -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- POPUP THÔNG BÁO THÀNH CÔNG -->
  <div id="successModal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 shadow-2xl text-center space-y-3 max-w-sm w-full animate-bounce">
      <div class="text-emerald-500 text-4xl">✓</div>
      <h3 class="text-lg font-bold text-gray-800">Đã cập nhật công việc!</h3>
      <p class="text-sm text-gray-500">Đang chuyển sang danh sách công việc...</p>
    </div>
  </div>

  <!-- MODAL ADMIN LOGIN & MANAGEMENT -->
  <div id="adminModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4 relative">
      <button onclick="toggleAdminModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">✕</button>
      
      <!-- Admin Login Form -->
      <div id="adminLoginForm">
        <h3 class="text-lg font-bold text-gray-800 mb-4">Đăng Nhập Quản Trị Viên</h3>
        <div class="space-y-3">
          <input type="text" id="adminUser" placeholder="Tên đăng nhập" class="w-full border rounded-lg p-2.5">
          <input type="password" id="adminPass" placeholder="Mật khẩu" class="w-full border rounded-lg p-2.5">
          <button onclick="loginAdmin()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium">Đăng Nhập</button>
        </div>
      </div>

      <!-- Admin Panel (Hiện khi đăng nhập thành công) -->
      <div id="adminPanel" class="hidden space-y-4">
        <h3 class="text-lg font-bold text-gray-800">Quản Lý Nhân Viên & Sheet</h3>
        <div class="space-y-3 border-t pt-3">
          <h4 class="text-sm font-semibold text-gray-700">Tạo người dùng & Sheet riêng mới:</h4>
          <input type="text" id="newFullName" placeholder="Họ và tên nhân viên" class="w-full border rounded-lg p-2 text-sm">
          <input type="text" id="newDept" placeholder="Phòng ban" class="w-full border rounded-lg p-2 text-sm">
          <button onclick="createNewUser()" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-medium">
            Tạo Người Dùng & Sheet Mới
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Thiết lập ngày mặc định (GMT+7)
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('workDate').value = today;
      loadUsers();
    });

    // Tải danh sách Họ tên và Phòng ban
    async function loadUsers() {
      try {
        const res = await fetch(`${API_URL}?action=getUsers`);
        currentUserList = await res.json();
        const select = document.getElementById('userSelect');
        select.innerHTML = '<option value="">-- Chọn nhân viên --</option>';
        currentUserList.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.fullName;
          opt.textContent = u.fullName;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error("Lỗi kết nối API", e);
      }
    }

    // Tự động điền Phòng ban khi chọn Họ tên
    function onUserChange() {
      const selectedName = document.getElementById('userSelect').value;
      const found = currentUserList.find(u => u.fullName === selectedName);
      document.getElementById('department').value = found ? found.department : '';
    }

    // Gửi Form Cập Nhật Công Việc
    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Đang gửi dữ liệu...";

      const data = {
        action: 'addLog',
        fullName: document.getElementById('userSelect').value,
        department: document.getElementById('department').value,
        task: document.getElementById('task').value,
        date: document.getElementById('workDate').value,
        details: document.getElementById('details').value,
        note: document.getElementById('note').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          // Hiển thị Pop-up thông báo thành công
          const modal = document.getElementById('successModal');
          modal.classList.remove('hidden');
          
          setTimeout(() => {
            modal.classList.add('hidden');
            showLogsPage(data.fullName);
          }, 2500);
        } else {
          alert("Lỗi: " + result.message);
        }
      } catch (err) {
        alert("Đã xảy ra lỗi gửi dữ liệu!");
      } finally {
        btn.disabled = false;
        btn.innerText = "Cập Nhật Công Việc";
      }
    }

    // Hiển thị Trang Danh sách công việc đã làm
    async function showLogsPage(userName) {
      showPage('list');
      document.getElementById('listUserTitle').innerText = `Nhân viên: ${userName}`;
      const tbody = document.getElementById('logsTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">Đang tải dữ liệu...</td></tr>';

      try {
        const res = await fetch(`${API_URL}?action=getLogs&userName=${encodeURIComponent(userName)}`);
        const logs = await res.json();
        tbody.innerHTML = '';

        if (logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">Chưa có nhật ký nào.</td></tr>';
          return;
        }

        logs.reverse().forEach(log => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50";
          tr.innerHTML = `
            <td class="p-3 border"><input type="date" value="${log.date}" id="date_${log.logId}" class="border rounded p-1 text-sm w-full"></td>
            <td class="p-3 border"><input type="text" value="${log.task}" id="task_${log.logId}" class="border rounded p-1 text-sm w-full"></td>
            <td class="p-3 border"><textarea id="details_${log.logId}" class="border rounded p-1 text-sm w-full">${log.details}</textarea></td>
            <td class="p-3 border"><input type="text" value="${log.note}" id="note_${log.logId}" class="border rounded p-1 text-sm w-full"></td>
            <td class="p-3 border text-center">
              <button onclick="saveLogEdit('${userName}', '${log.logId}')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs hover:bg-blue-700">Lưu</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-red-500">Lỗi lấy dữ liệu!</td></tr>';
      }
    }

    // Chỉnh sửa công việc cũ trực tiếp trên bảng
    async function saveLogEdit(userName, logId) {
      const updatedData = {
        action: 'updateLog',
        fullName: userName,
        logId: logId,
        date: document.getElementById(`date_${logId}`).value,
        task: document.getElementById(`task_${logId}`).value,
        details: document.getElementById(`details_${logId}`).value,
        note: document.getElementById(`note_${logId}`).value
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(updatedData)
      });
      const result = await res.json();
      if (result.status === 'success') {
        alert("Đã cập nhật chỉnh sửa thành công!");
      } else {
        alert("Lỗi cập nhật: " + result.message);
      }
    }

    // Xuất file CSV về máy tính
    function exportToCSV() {
      const table = document.querySelector("#pageList table");
      let csv = [];
      for (let row of table.rows) {
        let cols = Array.from(row.cells).slice(0, 4).map(td => {
          let input = td.querySelector('input, textarea');
          return `"${input ? input.value.replace(/"/g, '""') : td.innerText.replace(/"/g, '""')}"`;
        });
        csv.push(cols.join(","));
      }
      const blob = new Blob([csv.join("\n")], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Nhat_ky_cong_viec_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    // Điều hướng trang
    function showPage(page) {
      if (page === 'form') {
        document.getElementById('pageForm').classList.remove('hidden');
        document.getElementById('pageList').classList.add('hidden');
      } else {
        document.getElementById('pageForm').classList.add('hidden');
        document.getElementById('pageList').classList.remove('hidden');
      }
    }

    // Quản trị viên Modal
    function toggleAdminModal() {
      document.getElementById('adminModal').classList.toggle('hidden');
    }

    async function loginAdmin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'adminLogin', username: u, password: p })
      });
      const result = await res.json();
      if (result.status === 'success') {
        document.getElementById('adminLoginForm').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      } else {
        alert(result.message);
      }
    }

    async function createNewUser() {
      const name = document.getElementById('newFullName').value;
      const dept = document.getElementById('newDept').value;
      if (!name || !dept) return alert("Vui lòng nhập đủ thông tin!");

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createUser', fullName: name, department: dept })
      });
      const result = await res.json();
      if (result.status === 'success') {
        alert(`Đã thêm ${name} và tự động tạo Sheet mới!`);
        document.getElementById('newFullName').value = '';
        document.getElementById('newDept').value = '';
        loadUsers();
      }
    }
  </script>
</body>
</html>
